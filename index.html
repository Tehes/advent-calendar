<!DOCTYPE HTML>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="theme-color" content="#F5EEDF">

	<title>Advent Calendar</title>

	<meta name="description" content="Twenty-four days of hand-painted little wonders. An advent calendar in watercolour.">
	<meta name="author" content="Tino Sabetta">

	<meta property="og:type" content="website">
	<meta property="og:title" content="Advent Calendar">
	<meta property="og:description" content="Twenty-four days of hand-painted little wonders.">

	<link rel="apple-touch-icon" href="icons/180x180.png" />
	<link rel="icon" href="icons/favicon.png" sizes="32x32" type="image/png">
	<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
	<link rel="stylesheet" href="css/style.css">

	<script defer src="https://cloud.umami.is/script.js" data-website-id="2392a451-203c-4d8a-a4f5-bd7d06f832af"
		data-domains="tehes.github.io"></script>
</head>

<body>
	<main>
		<header>
			<h1>Advent Calendar</h1>
			<p>Twenty-four days of hand-painted watercolor illustrations</p>
		</header>
		<section id="calendar"></section>
	</main>

	<template id="doorTemplate">
		<button class="door" type="button">
			<span class="number"></span>
			<img alt="" hidden>
		</button>
	</template>

	<dialog id="illustrationDialog">
		<button id="closeDialog" type="button" autofocus>Close <span>×</span></button>
		<div class="image-stage">
			<p id="imageMessage">Loading illustration…</p>
			<img id="illustrationImage" alt="" hidden>
		</div>
	</dialog>

	<script type="module" src="./js/app.js"></script>
</body>

</html>
