<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
    <filter id="paper" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="3" seed="8" stitchTiles="stitch" />
        <feColorMatrix type="saturate" values="0" />
        <feComponentTransfer>
            <feFuncR type="linear" slope="4" intercept="-1.5" />
            <feFuncG type="linear" slope="4" intercept="-1.5" />
            <feFuncB type="linear" slope="4" intercept="-1.5" />
        </feComponentTransfer>
    </filter>
    <rect width="180" height="180" filter="url(#paper)" />
</svg>
